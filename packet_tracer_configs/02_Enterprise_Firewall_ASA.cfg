! ==============================================================================
! CISCO VIRTUAL INTERNSHIP 2026 - CYBER SECURITY PROJECT
! Component: Enterprise Perimeter Adaptive Security Appliance (ASA / Firepower)
! Device: Cisco ASA 5506-X / Firepower Threat Defense (FTD)
! Hostname: ENT-PERIMETER-FW-01
! Description: Edge Defense, Site-to-Site IPsec VPN to Cloud, AnyConnect SSL VPN,
!              Stateful Inspection, Identity NAT, and DMZ Isolation
! ==============================================================================

enable
configure terminal

! --- Basic System Configuration ---
hostname ENT-PERIMETER-FW-01
domain-name enterprise.netacad.internal
passwd Cisco@NetAcad2026!Admin
enable password Cisco@NetAcad2026!Secure

! --- Interface Definitions & Security Zones ---
! Inside Interface: Connection to Enterprise Core Router
interface GigabitEthernet1/1
 nameif inside
 security-level 100
 ip address 10.10.0.1 255.255.255.252
 no shutdown

! DMZ Interface: Isolated On-Prem Services & Proxies
interface GigabitEthernet1/2
 nameif dmz
 security-level 50
 ip address 192.168.50.1 255.255.255.0
 no shutdown

! Outside Interface: WAN Uplink to ISP Backbone
interface GigabitEthernet1/3
 nameif outside
 security-level 0
 ip address 203.0.113.2 255.255.255.252
 no shutdown

! Management Interface
interface Management1/1
 nameif management
 security-level 100
 ip address 192.168.1.1 255.255.255.0
 management-only
 no shutdown

! --- Static Routing Configuration ---
! Default Gateway to ISP Router
route outside 0.0.0.0 0.0.0.0 203.0.113.1 1

! Route back to Enterprise Campus & Data Center Subnets
route inside 10.10.0.0 255.255.0.0 10.10.0.2 1

! --- Object Definitions & Network Groups ---
object-group network ONPREM-ENTERPRISE-NETWORKS
 network-object 10.10.10.0 255.255.255.0
 network-object 10.10.20.0 255.255.255.0
 network-object 10.10.30.0 255.255.255.0
 network-object 10.10.99.0 255.255.255.0

object-group network CLOUD-VPC-NETWORKS
 network-object 172.20.1.0 255.255.255.0
 network-object 172.20.2.0 255.255.255.0
 network-object 172.20.3.0 255.255.255.0

object network OBJ-ONPREM-SUMMARY
 subnet 10.10.0.0 255.255.0.0

object network OBJ-CLOUD-SUMMARY
 subnet 172.20.0.0 255.255.0.0

object network OBJ-DMZ-WEB-SERVER
 host 192.168.50.10

! --- NAT / PAT Policies ---
! 1. Identity NAT (NAT Exemption) for Hybrid VPN Traffic
nat (inside,outside) source static OBJ-ONPREM-SUMMARY OBJ-ONPREM-SUMMARY destination static OBJ-CLOUD-SUMMARY OBJ-CLOUD-SUMMARY no-proxy-arp route-lookup

! 2. Static NAT for DMZ Public Access
object network OBJ-DMZ-WEB-SERVER
 nat (dmz,outside) static 203.0.113.10

! 3. Dynamic PAT for Outbound Internet Access from Inside & DMZ
object-group network NAT-PAT-SOURCES
 network-object 10.10.0.0 255.255.0.0
 network-object 192.168.50.0 255.255.255.0

object network OBJ-PAT-POOL
 host 203.0.113.2

nat (inside,outside) after-auto source dynamic NAT-PAT-SOURCES interface

! --- Access Control Lists (ACLs) & Zone Defense ---
! Outside Interface Ingress Filter
access-list ACL-OUTSIDE-IN extended permit icmp any any echo-reply
access-list ACL-OUTSIDE-IN extended permit icmp any any unreachable
access-list ACL-OUTSIDE-IN extended permit icmp any any time-exceeded
access-list ACL-OUTSIDE-IN extended permit tcp any host 203.0.113.10 eq 443
access-list ACL-OUTSIDE-IN extended permit tcp any host 203.0.113.10 eq 80
! IPsec VPN negotiation protocols from Cloud Gateway (198.51.100.2)
access-list ACL-OUTSIDE-IN extended permit udp host 198.51.100.2 host 203.0.113.2 eq isakmp
access-list ACL-OUTSIDE-IN extended permit udp host 198.51.100.2 host 203.0.113.2 eq non500-isakmp
access-list ACL-OUTSIDE-IN extended permit esp host 198.51.100.2 host 203.0.113.2
access-list ACL-OUTSIDE-IN extended deny ip any any log

access-group ACL-OUTSIDE-IN in interface outside

! DMZ Ingress Filter: Prevent DMZ from initiating sessions into Inside DC
access-list ACL-DMZ-IN extended permit udp host 192.168.50.10 host 10.10.30.50 eq domain
access-list ACL-DMZ-IN extended permit tcp host 192.168.50.10 host 10.10.30.10 eq 8080
access-list ACL-DMZ-IN extended deny ip 192.168.50.0 255.255.255.0 10.10.0.0 255.255.0.0
access-list ACL-DMZ-IN extended permit ip any any

access-group ACL-DMZ-IN in interface dmz

! --- Site-to-Site IPsec VPN Configuration (Hybrid Cloud Interconnect) ---
! Crypto ACL for VPN Tunnel
access-list ACL-VPN-HYBRID-TRAFFIC extended permit ip 10.10.0.0 255.255.0.0 172.20.0.0 255.255.0.0

! IKEv2 Phase 1 Proposal & Policy
crypto ikev2 policy 10
 encryption aes-256
 integrity sha256
 group 14
 prf sha256
 lifetime seconds 86400

crypto ikev2 enable outside

! IPsec Phase 2 Transform Set / Proposal
crypto ipsec ikev2 ipsec-proposal HYBRID-IPSEC-PROPOSAL
 protocol esp encryption aes-256
 protocol esp integrity sha-256

! Tunnel Group for Cloud Gateway Peer (198.51.100.2)
tunnel-group 198.51.100.2 type ipsec-l2l
tunnel-group 198.51.100.2 ipsec-attributes
 ikev2 remote-authentication pre-shared-key CiscoNetAcadHybridSecret2026!
 ikev2 local-authentication pre-shared-key CiscoNetAcadHybridSecret2026!

! Crypto Map Application
crypto map HYBRID-CRYPTO-MAP 10 match address ACL-VPN-HYBRID-TRAFFIC
crypto map HYBRID-CRYPTO-MAP 10 set peer 198.51.100.2
crypto map HYBRID-CRYPTO-MAP 10 set ikev2 ipsec-proposal HYBRID-IPSEC-PROPOSAL
crypto map HYBRID-CRYPTO-MAP 10 set security-association lifetime seconds 28800
crypto map HYBRID-CRYPTO-MAP interface outside

! --- Remote Access AnyConnect SSL VPN for Faculty & Remote Workforce ---
ip local pool ANYCONNECT-FACULTY-POOL 172.16.50.10-172.16.50.250 mask 255.255.255.0

access-list ACL-ANYCONNECT-SPLIT standard permit 10.10.0.0 255.255.0.0
access-list ACL-ANYCONNECT-SPLIT standard permit 172.20.0.0 255.255.0.0

group-policy GP-FACULTY-ZTNA internal
group-policy GP-FACULTY-ZTNA attributes
 vpn-tunnel-protocol ssl-client
 split-tunnel-policy tunnelspecified
 split-tunnel-network-list value ACL-ANYCONNECT-SPLIT
 dns-server value 10.10.30.50
 default-domain value enterprise.netacad.internal
 address-pools value ANYCONNECT-FACULTY-POOL

tunnel-group TG-FACULTY-REMOTE type remote-access
tunnel-group TG-FACULTY-REMOTE general-attributes
 default-group-policy GP-FACULTY-ZTNA
 authentication-server-group LOCAL

! --- Modular Policy Framework (MPF) & Deep Inspection ---
class-map CM-INSPECTION-TRAFFIC
 match default-inspection-traffic

policy-map PM-GLOBAL-INSPECTION
 class CM-INSPECTION-TRAFFIC
  inspect dns maximum-length 512
  inspect ftp
  inspect h323 h225
  inspect h323 ras
  inspect rsh
  inspect rtsp
  inspect esmtp
  inspect sqlnet
  inspect sip
  inspect skinny
  inspect tftp
  inspect http
  inspect icmp
  inspect icmp error

service-policy PM-GLOBAL-INSPECTION global

! --- Logging & Threat Auditing ---
logging enable
logging buffered notifications
logging trap warnings

write memory

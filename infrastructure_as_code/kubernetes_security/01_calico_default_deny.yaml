# Kubernetes / OpenShift Security Manifest
# Component: Zero-Trust Default Deny NetworkPolicy (Calico / Cilium / Kubernetes CNI)
# ==============================================================================

apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all-traffic
  namespace: production
  labels:
    security.cisco.com/policy: zero-trust-baseline
spec:
  podSelector: {} # Applies to all pods in the 'production' namespace
  policyTypes:
  - Ingress
  - Egress
  # With empty ingress and egress lists, ALL incoming and outgoing packets are dropped by default
